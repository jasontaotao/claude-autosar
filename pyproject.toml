[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-autosar-workspace"
version = "0.1.0"
description = "AutoC Claude Code 插件 - monorepo workspace"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/build", "**/dist", "**/.venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "UP", "ARG", "SIM"]
# 忽略：I001（import 排序交给 isort 单独管理，避免与 isort 冲突）、
#      RUF002（中文 docstring 标点误判）、E501（行长交由 black 控制）、
#      ARG002/ARG005（parametrize 与 Protocol 子类未使用全部入参是设计上的必要）
ignore = ["I001", "RUF002", "E501", "ARG002", "ARG005"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["claude_autosar"]
# 与 ruff I001 对齐：第三方（pytest）与第一方（claude_autosar）之间留空行
lines_between_sections = 1
force_sort_within_sections = true

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["packages/autoc/tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "autosar: AUTOSAR 相关",
    "tresos: EB tresos 集成",
    "davinci: DaVinci 集成",
    "arxml: ARXML 读写",
    "slow: 慢速测试",
    "requires_tools: 需要商业工具（CI 默认 skip）",
]

[tool.coverage.run]
source = ["packages/autoc/src/claude_autosar"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]


[tool.bandit]
# 设计性 intentional suppression — 注释解释每个 B-id 为何对 autoc-cc 适用：
# B101 assert_used：模块 invariant 检查（mcp_server FastMCP tool 注册 / bsw param type
#       narrowing / validator 路径段校验）。assert 在 -O 模式被消除对生产无影响，因为
#       CI 默认跑带 assert 的非优化解释器，且这些是"出错就崩"的硬性约束而非业务分支。
# B105 hardcoded_password_string：project_config.py:266 的 YAML 解析把 "null" 和 "~"
#       视为 None（YAML 1.1 标准）。字符串字面量是 YAML 协议标记，不是凭据。
# B404 subprocess_blacklist：adapter 层（tresos / davinci）设计上必需 subprocess 调
#       商业工具 CLI（tresos_cmd.bat / DVCfgCmd.exe）。subprocess 是核心架构，非误用。
# B603 subprocess_without_shell_equals_true：同上。我们刻意 shell=False + args list
#       防注入；bandit 误报此为"untrusted input"——已审计无此风险。
# B110 try_except_pass：3 个 result-to-dict helper 的 fallback chain（asdict 失败
#       退到 vars()）+ mcp_server verify 主链路里 load_v2_paths 的 best-effort
#       容错。已在代码注释里说明 intentional，不阻塞主流程。
skips = ["B101", "B105", "B404", "B603", "B110"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoc-cc-workspace"
version = "0.1.0"
description = "AutoC Claude Code 插件 - monorepo workspace"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/build", "**/dist", "**/.venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "UP", "ARG", "SIM"]
# 忽略：I001（import 排序交给 isort 单独管理，避免与 isort 冲突）、
#      RUF002（中文 docstring 标点误判）、E501（行长交由 black 控制）、
#      ARG002/ARG005（parametrize 与 Protocol 子类未使用全部入参是设计上的必要）
ignore = ["I001", "RUF002", "E501", "ARG002", "ARG005"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["claude_autosar"]
# 与 ruff I001 对齐：第三方（pytest）与第一方（claude_autosar）之间留空行
lines_between_sections = 1
force_sort_within_sections = true

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["packages/autoc/tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "e2e: 端到端测试",
    "autosar: AUTOSAR 相关",
    "tresos: EB tresos 集成",
    "davinci: DaVinci 集成",
    "arxml: ARXML 读写",
    "slow: 慢速测试",
    "requires_tools: 需要商业工具（CI 默认 skip）",
]

[tool.coverage.run]
source = ["packages/autoc/src/claude_autosar"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

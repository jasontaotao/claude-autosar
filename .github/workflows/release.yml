name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Upload to TestPyPI instead of PyPI"
        type: boolean
        default: false

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for setuptools_scm / changelog generation

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Build autoc wheel + sdist
        run: python -m build packages/autoc/

      - name: Validate metadata (twine check)
        run: |
          python -m pip install --upgrade twine
          twine check packages/autoc/dist/*

      - name: Smoke test wheel in fresh venv
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install packages/autoc/dist/*.whl
          .venv-smoke/bin/autoc --version
          .venv-smoke/bin/python -c "from autoc.cli.mcp_server import build_mcp_server; build_mcp_server()"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autoc-dist
          path: packages/autoc/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/autoc
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: autoc-dist
          path: dist/

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # No password/API token: trusted publishing (OIDC) + GitHub
          # environment protection (configured in PyPI project settings).

  publish-test:
    name: Publish to TestPyPI (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.test_pypi == true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: test-pypi
      url: https://test.pypi.org/p/autoc
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: autoc-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff + black + isort)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/autoc/pyproject.toml
      - name: Install autoc with dev extras
        run: pip install -e packages/autoc[dev]
      - name: ruff
        run: ruff check packages/autoc/src packages/autoc/tests
      - name: black --check
        run: black --check packages/autoc/src packages/autoc/tests
      - name: isort --check
        run: isort --check packages/autoc/src packages/autoc/tests

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/autoc/pyproject.toml
      - name: Install autoc with dev extras
        run: pip install -e packages/autoc[dev]
      - name: mypy --strict
        run: mypy --strict packages/autoc/src/autoc

  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/autoc/pyproject.toml
      - name: Install autoc with dev extras
        run: pip install -e packages/autoc[dev]
      - name: bandit
        run: bandit -r packages/autoc/src/autoc -ll
      - name: pip-audit
        run: pip-audit

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/autoc/pyproject.toml
      - name: Install autoc with dev extras
        run: pip install -e packages/autoc[dev]
      - name: pytest with coverage
        run: |
          pytest packages/autoc/tests \
            -m "not requires_tools" \
            --cov=packages/autoc/src/autoc \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=80

  build:
    name: Build sanity
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [lint, typecheck, security, test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/autoc/pyproject.toml
      - name: Install autoc
        run: pip install -e packages/autoc
      - name: Import check
        run: python -c "import autoc; print('autoc imported OK')"
      - name: CLI version
        run: autoc --version

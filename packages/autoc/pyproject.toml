[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-autosar"
version = "0.1.0"
description = "claude-autosar - AUTOSAR BSW AI 配置助手 Python 核心"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AutoC Contributors" },
]
keywords = ["autosar", "bsw", "tresos", "davinci", "arxml", "ecu", "embedded", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Automotive Engineers",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=5.0",
    "cantools>=39.0",
    "rich>=13.0",
    "mcp>=0.9",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/autoc-cc/autoc-cc"
Repository = "https://github.com/autoc-cc/autoc-cc"
Issues = "https://github.com/autoc-cc/autoc-cc/issues"
Changelog = "https://github.com/autoc-cc/autoc-cc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "black>=24.4",
    "ruff>=0.5",
    "isort>=5.13",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[project.scripts]
claude-autosar = "claude_autosar.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_autosar = ["py.typed"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-autosar"
version = "0.3.1"
description = "claude-autosar - AUTOSAR BSW 双格式 (.arxml + .xdm) 配置 IO / 模板 diff / lint / verify 工具集"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AutoC Contributors" },
]
keywords = ["autosar", "bsw", "tresos", "davinci", "arxml", "ecu", "embedded", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=5.0,<6.0",
    "cantools>=39.0,<40.0",
    "rich>=13.0,<14.0",
    "mcp>=0.9,<2.0",
    "platformdirs>=4.0,<5.0",
    "tomli-w>=1.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/jasontaotao/claude-autosar"
Repository = "https://github.com/jasontaotao/claude-autosar"
Issues = "https://github.com/jasontaotao/claude-autosar/issues"
Changelog = "https://github.com/jasontaotao/claude-autosar/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.23,<1.0",
    "black>=24.4,<25.0",
    "ruff>=0.5,<1.0",
    "isort>=5.13,<6.0",
    "mypy>=1.10,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "pre-commit>=3.7,<4.0",
]

[project.scripts]
claude-autosar = "claude_autosar.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_autosar = ["py.typed"]
